<style>
/* ==========================================================================
   DYNAMIC CIAMIK COLOR PALETTES (Claude, AntiGravity, Cursor, Matrix, Nebula)
   ========================================================================== */
:root {
  --font-main: 'Plus Jakarta Sans', system-ui, sans-serif;
  --font-serif: 'Instrument Serif', Georgia, serif;
  --font-mono: 'JetBrains Mono', monospace;
  
  /* DEFAULT: Obsidian Bronze (AntiGravity) */
  --bg-app: #08090d;
  --bg-sidebar: #0e1017;
  --bg-card: rgba(18, 21, 31, 0.75);
  --bg-card-hover: rgba(26, 30, 44, 0.85);
  --bg-user-bubble: #171b28;
  --bg-bot-bubble: rgba(14, 17, 26, 0.85);
  --bg-composer: rgba(16, 19, 29, 0.92);
  --border-subtle: rgba(255, 255, 255, 0.07);
  --border-strong: rgba(212, 168, 106, 0.35);
  --accent-primary: #d4a86a;
  --accent-hover: #e3c59a;
  --accent-rgb: 212, 168, 106;
  --accent-glow: rgba(212, 168, 106, 0.25);
  --text-main: #f1f5f9;
  --text-muted: #94a3b8;
  --text-subtle: #64748b;
  --dot-color: rgba(255, 255, 255, 0.05);
}

[data-theme="claude"] {
  /* Claude 3.7 Warm Terracotta & Ivory Slate */
  --bg-app: #12100f;
  --bg-sidebar: #191614;
  --bg-card: rgba(30, 26, 23, 0.8);
  --bg-card-hover: rgba(42, 36, 32, 0.9);
  --bg-user-bubble: #28221e;
  --bg-bot-bubble: rgba(26, 22, 20, 0.9);
  --bg-composer: rgba(32, 27, 24, 0.95);
  --border-subtle: rgba(255, 255, 255, 0.08);
  --border-strong: rgba(222, 122, 94, 0.4);
  --accent-primary: #da7756;
  --accent-hover: #e88d67;
  --accent-rgb: 218, 119, 86;
  --accent-glow: rgba(218, 119, 86, 0.28);
  --text-main: #faf5f0;
  --text-muted: #b8aba0;
  --text-subtle: #7d7268;
  --dot-color: rgba(218, 119, 86, 0.06);
}

[data-theme="cursor"] {
  /* Cursor Dark Neon Cyber */
  --bg-app: #07080b;
  --bg-sidebar: #0d0f15;
  --bg-card: rgba(16, 19, 28, 0.8);
  --bg-card-hover: rgba(24, 29, 42, 0.9);
  --bg-user-bubble: #161b2b;
  --bg-bot-bubble: rgba(13, 16, 24, 0.9);
  --bg-composer: rgba(14, 18, 27, 0.95);
  --border-subtle: rgba(255, 255, 255, 0.07);
  --border-strong: rgba(0, 242, 254, 0.45);
  --accent-primary: #00f2fe;
  --accent-hover: #4facfe;
  --accent-rgb: 0, 242, 254;
  --accent-glow: rgba(0, 242, 254, 0.3);
  --text-main: #f8fafc;
  --text-muted: #94a3b8;
  --text-subtle: #64748b;
  --dot-color: rgba(0, 242, 254, 0.05);
}

[data-theme="matrix"] {
  /* Bio-Tech Neural Emerald */
  --bg-app: #060c09;
  --bg-sidebar: #0b1410;
  --bg-card: rgba(14, 26, 20, 0.75);
  --bg-card-hover: rgba(20, 38, 29, 0.85);
  --bg-user-bubble: #12241b;
  --bg-bot-bubble: rgba(11, 20, 16, 0.9);
  --bg-composer: rgba(13, 24, 18, 0.95);
  --border-subtle: rgba(255, 255, 255, 0.07);
  --border-strong: rgba(16, 185, 129, 0.4);
  --accent-primary: #10b981;
  --accent-hover: #34d399;
  --accent-rgb: 16, 185, 129;
  --accent-glow: rgba(16, 185, 129, 0.28);
  --text-main: #ecfdf5;
  --text-muted: #a7f3d0;
  --text-subtle: #059669;
  --dot-color: rgba(16, 185, 129, 0.06);
}

[data-theme="nebula"] {
  /* Nebula Velvet & Royal Amethyst */
  --bg-app: #090812;
  --bg-sidebar: #100f1f;
  --bg-card: rgba(22, 20, 42, 0.8);
  --bg-card-hover: rgba(33, 30, 62, 0.9);
  --bg-user-bubble: #201b3b;
  --bg-bot-bubble: rgba(17, 15, 33, 0.9);
  --bg-composer: rgba(19, 17, 36, 0.95);
  --border-subtle: rgba(255, 255, 255, 0.08);
  --border-strong: rgba(168, 85, 247, 0.45);
  --accent-primary: #a855f7;
  --accent-hover: #c084fc;
  --accent-rgb: 168, 85, 247;
  --accent-glow: rgba(168, 85, 247, 0.3);
  --text-main: #faf5ff;
  --text-muted: #d8b4fe;
  --text-subtle: #7e22ce;
  --dot-color: rgba(168, 85, 247, 0.06);
}

/* Custom Scrollbars */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb {
  background: var(--border-subtle);
  border-radius: 9999px;
}
::-webkit-scrollbar-thumb:hover {
  background: rgba(var(--accent-rgb), 0.3);
}

/* Grid Pattern Background */
.bg-grid-tech {
  background-image: 
    linear-gradient(to right, var(--dot-color) 1px, transparent 1px),
    linear-gradient(to bottom, var(--dot-color) 1px, transparent 1px);
  background-size: 32px 32px;
}

/* Animations */
@keyframes glowPulse {
  0%, 100% { opacity: 0.35; transform: scale(1); }
  50% { opacity: 0.7; transform: scale(1.04); }
}
.animate-glow-pulse { animation: glowPulse 6s ease-in-out infinite; }

@keyframes floatOrb {
  0%, 100% { transform: translate(0, 0); }
  50% { transform: translate(30px, -20px); }
}
.animate-float-orb { animation: floatOrb 12s ease-in-out infinite; }

@keyframes waveBar {
  0%, 100% { transform: scaleY(0.25); }
  50% { transform: scaleY(1); }
}
.wave-1 { animation: waveBar 0.9s ease-in-out infinite; }
.wave-2 { animation: waveBar 0.9s ease-in-out infinite 0.18s; }
.wave-3 { animation: waveBar 0.9s ease-in-out infinite 0.36s; }
.wave-4 { animation: waveBar 0.9s ease-in-out infinite 0.54s; }

/* Typing cursor blink */
@keyframes cursorBlink {
  0%, 100% { opacity: 1; }
  50% { opacity: 0; }
}
.typing-cursor {
  display: inline-block;
  width: 6px;
  height: 15px;
  background-color: var(--accent-primary);
  margin-left: 3px;
  vertical-align: middle;
  animation: cursorBlink 0.8s infinite;
  border-radius: 1px;
}

/* Glassmorphism helpers */
.glass-panel {
  background: var(--bg-card);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 1px solid var(--border-subtle);
}
.glass-panel:hover {
  border-color: var(--border-strong);
}

.composer-glass {
  background: var(--bg-composer);
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
  border: 1px solid var(--border-subtle);
  box-shadow: 0 20px 50px -15px rgba(0, 0, 0, 0.7), 0 0 30px -10px var(--accent-glow);
}

/* Smooth transitions */
body, aside, main, header, div, button, textarea {
  transition: background-color 0.25s cubic-bezier(0.16, 1, 0.3, 1),
              border-color 0.25s cubic-bezier(0.16, 1, 0.3, 1),
              color 0.2s ease,
              box-shadow 0.25s ease;
}
</style>
</head>

<body class="h-screen w-screen flex overflow-hidden font-sans select-none antialiased text-slate-100" style="background-color: var(--bg-app);">

<!-- Canvas Interactive Ambient Particle Layer -->
<canvas id="ambientCanvas" class="fixed inset-0 pointer-events-none z-0 opacity-40"></canvas>

<!-- Top Ambient Radial Glows -->
<div class="fixed top-[-100px] left-1/2 -translate-x-1/2 w-[900px] h-[450px] rounded-full pointer-events-none animate-glow-pulse blur-[140px] z-0"
     style="background: radial-gradient(circle, var(--accent-glow) 0%, transparent 70%);"></div>

<!-- ========================================================================
     SIDEBAR: ANTIGRAVITY / CURSOR INSPIRED WORKSPACE MANAGER
     ======================================================================== -->
<aside id="sidebar" class="w-80 border-r flex flex-col z-40 fixed md:relative h-full transition-all duration-300 -translate-x-full md:translate-x-0 select-text"

  <!-- Sidebar Header: Brand Monogram & Live Version -->
  <div class="p-4 border-b flex items-center justify-between" style="border-color: var(--border-subtle);">
    <a href="/chat" class="flex items-center gap-3 group">
      <div class="w-9 h-9 rounded-xl flex items-center justify-center font-serif text-lg font-bold shadow-md transition-all group-hover:scale-105"

      </div>
      <div>
        <div class="flex items-center gap-2">
          <span class="font-bold text-sm tracking-tight" style="color: var(--text-main);">Sagi Neural</span>

                style="background: rgba(var(--accent-rgb), 0.15); color: var(--accent-primary); border: 1px solid rgba(var(--accent-rgb), 0.3);">

  <!-- New Session Action -->
  <div class="p-3">
    <button id="newchat" class="w-full flex items-center justify-between px-3.5 py-2.5 rounded-xl text-xs font-semibold tracking-wide transition-all group shadow-sm hover:scale-[1.01]"

      <div class="flex items-center gap-2.5">
        <svg class="w-4 h-4 transition-transform group-hover:rotate-90 duration-300" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/>

    </button>

  <!-- Search Session Input -->
  <div class="px-3 pb-1">

  <!-- Conversations List -->

    </div>

  <!-- Sidebar Bottom Panel: Metrics & Shortcuts -->
  <div class="p-3 border-t space-y-3" style="border-color: var(--border-subtle); background: rgba(0,0,0,0.2);">

    <div class="p-2.5 rounded-xl border flex flex-col gap-1.5"

        </div>
        <a href="/models" class="text-[10px] font-mono hover:underline" style="color: var(--accent-primary);">Ganti Core →</a>
      </div>
      <div class="flex items-center justify-between">
        <div id="sidebarActiveModel" class="font-bold text-xs font-mono" style="color: var(--text-main);">

        </div>
        <span class="text-[10px] font-mono px-1.5 py-0.5 rounded bg-white/[0.04] text-slate-400 border border-white/[0.06]">
          12M + RAG
        </span>
      </div>
    </div>

    <!-- Quick Navigation Hub -->
    <div class="grid grid-cols-2 gap-2 text-xs font-mono">
      <a href="/" class="flex items-center justify-center gap-1.5 py-2 px-2.5 rounded-lg border hover:bg-white/[0.04] text-slate-300 transition-colors"

</aside>

<script>
/* ==========================================================================
   1. SOUND FX SYNTHESIZER (Pure Web Audio API - Zero External Dependencies)
   ========================================================================== */
class SoundEngine {
  constructor() {
    this.ctx = null;
    this.muted = localStorage.getItem('sagi_sound_muted') === 'true';
    this.updateIcon();
  }

  init() {
    if (!this.ctx) {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (AudioCtx) this.ctx = new AudioCtx();
    }
    if (this.ctx && this.ctx.state === 'suspended') {
      this.ctx.resume();
    }
  }

  toggle() {
    this.muted = !this.muted;
    localStorage.setItem('sagi_sound_muted', this.muted);
    this.updateIcon();
    if (!this.muted) this.playTone(520, 0.08, 'sine');
  }

  updateIcon() {
    const icon = document.getElementById('soundIcon');
    if (icon) icon.innerText = this.muted ? '🔇' : '🔊';
  }

  playTone(freq, duration, type = 'sine', gainVal = 0.08) {
    if (this.muted) return;
    try {
      this.init();
      if (!this.ctx) return;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
      gain.gain.setValueAtTime(gainVal, this.ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + duration);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start();
      osc.stop(this.ctx.currentTime + duration);
    } catch(e) {}
  }

  playSend() {
    if (this.muted) return;
    this.playTone(440, 0.06, 'triangle', 0.06);
    setTimeout(() => this.playTone(660, 0.08, 'sine', 0.05), 50);
  }

  playReceive() {
    if (this.muted) return;
    this.playTone(587, 0.08, 'sine', 0.05);
    setTimeout(() => this.playTone(880, 0.12, 'triangle', 0.06), 70);
  }

  playClick() {
    if (this.muted) return;
    this.playTone(700, 0.03, 'sine', 0.03);
  }

  playAlert() {
    if (this.muted) return;
    this.playTone(330, 0.1, 'sawtooth', 0.05);
    setTimeout(() => this.playTone(280, 0.15, 'sawtooth', 0.06), 90);
  }
}
const sfx = new SoundEngine();

/* ==========================================================================
   2. INTERACTIVE AMBIENT PARTICLES (Canvas Background)
   ========================================================================== */
const canvas = document.getElementById('ambientCanvas');
const ctx = canvas?.getContext('2d');
let particles = [];

function resizeCanvas() {
  if (!canvas) return;
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

class Particle {
  constructor() {
    this.reset();
  }
  reset() {
    this.x = Math.random() * (canvas?.width || 800);
    this.y = Math.random() * (canvas?.height || 600);
    this.vx = (Math.random() - 0.5) * 0.4;
    this.vy = (Math.random() - 0.5) * 0.4;
    this.radius = Math.random() * 1.5 + 0.5;
    this.alpha = Math.random() * 0.3 + 0.1;
  }
  update() {
    this.x += this.vx;
    this.y += this.vy;
    if (this.x < 0 || this.x > (canvas?.width || 800) || this.y < 0 || this.y > (canvas?.height || 600)) {
      this.reset();
    }
  }
  draw() {
    if (!ctx) return;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(255, 255, 255, ${this.alpha})`;
    ctx.fill();
  }
}

for (let i = 0; i < 40; i++) {
  particles.push(new Particle());
}

function animateParticles() {
  if (ctx && canvas) {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    particles.forEach(p => {
      p.update();
      p.draw();
    });
  }
  requestAnimationFrame(animateParticles);
}
animateParticles();

/* ==========================================================================
   4. RICH MARKDOWN & SYNTAX FORMATTER
   ========================================================================== */
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
const now = () => new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });

function safeUrl(u) {
  try {
    const p = new URL(u, location.origin);
    if (p.protocol === 'http:' || p.protocol === 'https:') return p.href;
  } catch(e) {}
  return '#';
}

function formatMarkdown(text) {
  if (!text) return '';
  let s = esc(text);

  // Headers
  s = s.replace(/^###\s+(.+)$/gm, '<h3 class="text-sm sm:text-base font-bold tracking-tight pb-1 mt-3 mb-1.5 flex items-center gap-2 border-b border-white/[0.08]" style="color: var(--accent-primary);"><span class="w-1.5 h-3 rounded-full" style="background-color: var(--accent-primary);"></span>$1</h3>');
  s = s.replace(/^##\s+(.+)$/gm, '<h2 class="text-base sm:text-lg font-bold tracking-tight pb-1 mt-4 mb-2 border-b border-white/[0.08]" style="color: var(--text-main);">$1</h2>');
  s = s.replace(/^#\s+(.+)$/gm, '<h1 class="text-lg sm:text-xl font-bold tracking-tight pb-1 mt-4 mb-2" style="color: var(--text-main);">$1</h1>');

  // Bold & Italic
  s = s.replace(/\*\*\*(.*?)\*\*\*/g, '<strong class="font-bold italic text-white">$1</strong>');
  s = s.replace(/\*\*(.*?)\*\*/g, '<strong class="font-bold text-white">$1</strong>');
  s = s.replace(/\*(.*?)\*/g, '<em class="italic" style="color: var(--accent-hover);">$1</em>');

  // Bullet Lists
  s = s.replace(/^[•\-]\s+(.+)$/gm, '<div class="flex items-start gap-2 ml-1 my-1 text-slate-200"><span style="color: var(--accent-primary); font-size: 1.1em; line-height: 1;">•</span><span class="flex-1">$1</span></div>');
  
  // Numbered Lists
  s = s.replace(/^(\d+)\.\s+(.+)$/gm, '<div class="flex items-start gap-2 ml-1 my-1 text-slate-200"><span class="font-mono text-xs font-bold px-1.5 py-0.2 rounded mt-0.5" style="background: rgba(var(--accent-rgb), 0.15); color: var(--accent-primary);">$1.</span><span class="flex-1">$2</span></div>');

  // Blockquotes
  s = s.replace(/^>\s+(.+)$/gm, '<div class="border-l-2 pl-3 py-1 my-2 italic text-slate-300 rounded-r-lg" style="border-color: var(--accent-primary); background: rgba(var(--accent-rgb), 0.05);">$1</div>');

  // Code inline
  s = s.replace(/`([^`]+)`/g, '<code class="font-mono text-xs px-1.5 py-0.5 rounded border border-white/[0.08]" style="background: rgba(0,0,0,0.35); color: var(--accent-hover);">$1</code>');

  return s;
}

    b.onclick = (e) => {
      if (e.target.closest('.del-chat')) {
        e.stopPropagation();
        sfx.playAlert();
        chats.splice(realIdx, 1);
        if (cur >= chats.length) cur = chats.length - 1;

      paint();
      renderList(query);
      if (window.innerWidth < 768) sidebar.classList.add('-translate-x-full');
    };

    convs.appendChild(b);
  });
}

          <div class="text-xs font-semibold text-slate-100">Penyaluran BLT Kemensos via Kantor Pos</div>
          <div class="text-[11px] text-slate-400 mt-1">Validasi domain kementerian resmi .go.id</div>
        </div>

        <div data-q="VIRAL! Minum rebusan paku dan daun sirih menyembuhkan kanker dalam 3 hari, sebarkan sebelum dihapus!" 
             class="card-prompt glass-panel p-4 rounded-2xl cursor-pointer hover:scale-[1.02] transition-all group">
          <div class="flex items-center justify-between text-xs font-mono mb-1.5">
            <span class="text-amber-400 font-semibold flex items-center gap-1.5">
              <span class="w-2 h-2 rounded-full bg-amber-400"></span>
              Hoaks Kesehatan
            </span>
            <span class="group-hover:translate-x-1 transition-transform" style="color: var(--accent-primary);">→</span>
          </div>
          <div class="text-xs font-semibold text-slate-100">Klaim obat ajaib kanker tanpa uji medis</div>
          <div class="text-[11px] text-slate-400 mt-1">Pembedahan bahaya toksik & pseudosains</div>
        </div>

        <div data-q="Tolong buatkan kode python untuk game snake" 
             class="card-prompt glass-panel p-4 rounded-2xl cursor-pointer hover:scale-[1.02] transition-all group">
          <div class="flex items-center justify-between text-xs font-mono mb-1.5">
            <span class="text-sky-400 font-semibold flex items-center gap-1.5">
              <span class="w-2 h-2 rounded-full bg-sky-400"></span>
              Uji Guardrail AI
            </span>
            <span class="group-hover:translate-x-1 transition-transform" style="color: var(--accent-primary);">→</span>
          </div>
          <div class="text-xs font-semibold text-slate-100">Permintaan kode pemrograman di luar ranah berita</div>
          <div class="text-[11px] text-slate-400 mt-1">Evaluasi mekanisme penolakan sopan Sagi</div>
        </div>

      </div>
    </div>
  `;

  box.querySelectorAll('.card-prompt').forEach(card => {
    card.onclick = () => {
      sfx.playClick();
      inp.value = card.dataset.q;
      kirim();
    };
  });
}

/* ==========================================================================
   7. MESSAGE BUBBLES WITH VERDICT GAUGES & ACTION TOOLBARS
   ========================================================================== */
function appendBubble(who, htmlContent, meta = '', rawVerdict = null, rawSources = null, shouldAnimate = true) {
  const isUser = who === 'u';
  const row = document.createElement('div');
  row.className = `flex flex-col ${isUser ? 'items-end' : 'items-start'} space-y-1.5 w-full`;

  if (isUser) {
    row.innerHTML = `
      <div class="max-w-[85%] sm:max-w-[75%] rounded-2xl rounded-tr-sm px-4 py-3 text-sm sm:text-[15px] text-slate-100 shadow-md leading-relaxed border"
           style="background-color: var(--bg-user-bubble); border-color: var(--border-subtle);">
        ${esc(htmlContent)}
      </div>
      <div class="text-[10px] font-mono text-slate-500 px-1">${now()}</div>
    `;
  } else {
    // Generate Verdict Gauge Widget if verdict exists
    let verdictHtml = '';
    if (rawVerdict) {
      const v = rawVerdict;
      const label = (v.label || 'meragukan').toLowerCase();
      const skor = typeof v.skor === 'number' ? v.skor : 50;

      let themeColor = '#f59e0b';
      let themeBg = 'rgba(245, 158, 11, 0.12)';
      let themeBorder = 'rgba(245, 158, 11, 0.3)';
      let labelBadge = 'MERAGUKAN / PERLU BUKTI';

      if (label === 'hoaks') {
        themeColor = '#f43f5e';
        themeBg = 'rgba(244, 63, 94, 0.12)';
        themeBorder = 'rgba(244, 63, 94, 0.35)';
        labelBadge = 'HOAKS / INDIKASI KUAT PALSU';
      } else if (label === 'valid') {
        themeColor = '#10b981';
        themeBg = 'rgba(16, 185, 129, 0.12)';
        themeBorder = 'rgba(16, 185, 129, 0.35)';
        labelBadge = 'VALID / TERKONFIRMASI RESMI';
      } else if (label === 'fiksi') {
        themeColor = '#38bdf8';
        themeBg = 'rgba(56, 189, 248, 0.12)';
        themeBorder = 'rgba(56, 189, 248, 0.35)';
        labelBadge = 'FIKSI / REKAAN CERITA';
      }

      // Circumference for 24 radius circle is ~150.8
      const radius = 24;
      const circ = 2 * Math.PI * radius;
      const strokeOffset = circ - (skor / 100) * circ;

      let sourcesHtml = '';
      if (rawSources) {
        (rawSources.wikipedia || []).forEach(s => {
          if (s.url) {
            sourcesHtml += `
              <a href="${safeUrl(s.url)}" target="_blank" rel="noopener noreferrer" 
                 class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-lg border text-[11px] font-mono text-slate-300 hover:text-white transition-colors"
                 style="background: rgba(255,255,255,0.04); border-color: var(--border-subtle);">
                <span class="text-slate-400">Wiki:</span>
                <span class="font-medium truncate max-w-[140px] sm:max-w-[200px]">${esc(s.judul)}</span>
                <span class="text-[9px]">↗</span>
              </a>
            `;
          }
        });
        (rawSources.web || []).forEach(s => {
          if (s.url) {
            sourcesHtml += `
              <a href="${safeUrl(s.url)}" target="_blank" rel="noopener noreferrer" 
                 class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-lg border text-[11px] font-mono text-cyan-300 hover:text-cyan-200 transition-colors"
                 style="background: rgba(6, 182, 212, 0.1); border-color: rgba(6, 182, 212, 0.25);">
                <span class="text-cyan-400">🌐 Web:</span>
                <span class="font-medium truncate max-w-[140px] sm:max-w-[200px]">${esc(s.judul)}</span>
                <span class="text-[9px]">↗</span>
              </a>
            `;
          }
        });
        (rawSources.cek_fakta || []).forEach(s => {
          sourcesHtml += `
            <a href="${safeUrl(s.url)}" target="_blank" rel="noopener noreferrer" 
               class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-lg border text-[11px] font-mono text-emerald-300 hover:text-emerald-200 transition-colors"
               style="background: rgba(16, 185, 129, 0.1); border-color: rgba(16, 185, 129, 0.25);">
              <span>${esc(s.judul)}</span>
              <span class="text-[9px]">↗</span>
            </a>
          `;
        });
      }

      verdictHtml = `
        <div class="mt-4 p-4 rounded-2xl border space-y-3"
             style="background: ${themeBg}; border-color: ${themeBorder};">
          
          <div class="flex items-center justify-between flex-wrap gap-3">
            
            <div class="flex items-center gap-3">
              <!-- Animated SVG Gauge -->
              <div class="relative w-14 h-14 flex items-center justify-center flex-shrink-0">
                <svg class="w-14 h-14 transform -rotate-90">
                  <circle cx="28" cy="28" r="${radius}" stroke="rgba(255,255,255,0.1)" stroke-width="4.5" fill="none"/>
                  <circle cx="28" cy="28" r="${radius}" stroke="${themeColor}" stroke-width="4.5" stroke-dasharray="${circ}" stroke-dashoffset="${strokeOffset}" stroke-linecap="round" fill="none" class="transition-all duration-1000"/>
                </svg>
                <div class="absolute inset-0 flex flex-col items-center justify-center font-mono font-bold text-xs" style="color: ${themeColor};">
                  <span>${skor}</span>
                  <span class="text-[8px] opacity-70 -mt-1">SKOR</span>
                </div>
              </div>

              <div>
                <div class="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-[10px] font-mono font-bold tracking-wider uppercase border"
                     style="background: rgba(0,0,0,0.3); color: ${themeColor}; border-color: ${themeColor};">
                  <span class="w-1.5 h-1.5 rounded-full" style="background-color: ${themeColor};"></span>
                  <span>${labelBadge}</span>
                </div>
                <div class="text-xs text-slate-300 font-medium mt-1">
                  ${esc(v.kesimpulan || 'Hasil verifikasi objektif.')}
                </div>
              </div>
            </div>

            <!-- Model Core Stamp -->
            <div class="text-[10px] font-mono text-cyan-300 bg-cyan-950/40 px-2.5 py-1 rounded-lg border border-cyan-500/20 flex items-center gap-1.5">
              <span class="w-1.5 h-1.5 rounded-full bg-cyan-400 animate-pulse"></span>
              Plosagata_Browser 25M
            </div>

          </div>

          <!-- Citation Links Matrix -->
          ${sourcesHtml ? `
            <div class="pt-2.5 border-t border-white/[0.07] flex flex-wrap items-center gap-1.5">
              <span class="text-[10px] font-mono text-slate-400 mr-1">Rujukan Cek Fakta:</span>
              ${sourcesHtml}
            </div>
          ` : ''}

        </div>
      `;
    }

    const bubbleId = 'bubble-' + Math.random().toString(36).slice(2, 9);

    row.innerHTML = `
      <div class="w-full flex items-start gap-3">
        <!-- Assistant Avatar Monogram -->
        <div class="w-8 h-8 rounded-xl border flex items-center justify-center text-xs font-serif italic font-bold flex-shrink-0 mt-0.5 shadow-sm"
             style="background: var(--bg-card); border-color: var(--border-strong); color: var(--accent-primary);">
          S
        </div>
        
        <div class="flex-1 space-y-2 max-w-full">
          <div class="flex items-center justify-between">
            <div class="flex items-center gap-2">
              <span class="text-xs font-semibold" style="color: var(--text-main);">Sagi AI</span>
              <span class="text-[10px] font-mono text-slate-500">${meta || now()}</span>
            </div>

            <!-- Action Toolbar (Copy / Listen / Export) -->
            <div class="flex items-center gap-1 text-slate-400">
              <button class="copy-btn p-1 rounded-md hover:bg-white/[0.06] hover:text-white transition-colors" title="Salin Jawaban" data-target="${bubbleId}">
                📋
              </button>
              <button class="speak-btn p-1 rounded-md hover:bg-white/[0.06] hover:text-amber-400 transition-colors" title="Dengarkan Suara" data-target="${bubbleId}">
                🔊
              </button>
            </div>
          </div>

          <!-- Assistant Content Box -->
          <div id="${bubbleId}" class="rounded-2xl rounded-tl-sm p-4 sm:p-5 text-sm sm:text-[15px] text-slate-200 leading-relaxed shadow-sm border"
               style="background-color: var(--bg-bot-bubble); border-color: var(--border-subtle);">
            <div class="assistant-text-content whitespace-pre-line leading-relaxed space-y-2">
              ${htmlContent}
            </div>
            ${verdictHtml}
          </div>
        </div>
      </div>
    `;

    // Hook Copy Action
    row.querySelector('.copy-btn')?.addEventListener('click', function() {
      const text = row.querySelector('.assistant-text-content')?.innerText || '';
      navigator.clipboard.writeText(text);
      sfx.playClick();
      this.innerText = '✅';
      setTimeout(() => { this.innerText = '📋'; }, 1500);
    });

    // Hook Text-to-Speech Action
    row.querySelector('.speak-btn')?.addEventListener('click', function() {
      const text = row.querySelector('.assistant-text-content')?.innerText || '';
      if (!window.speechSynthesis) return;
      if (window.speechSynthesis.speaking) {
        window.speechSynthesis.cancel();
        this.innerText = '🔊';
        return;
      }
      sfx.playTone(700, 0.08);
      const utter = new SpeechSynthesisUtterance(text.replace(/###|##|#|\*|_|•/g, ''));
      utter.lang = 'id-ID';
      utter.rate = 1.05;
      utter.onend = () => { this.innerText = '🔊'; };
      this.innerText = '⏹️';
      window.speechSynthesis.speak(utter);
    });
  }

  box.appendChild(row);
  box.scrollTop = box.scrollHeight;
}

function pushHistory(w, h, meta, rawVerdict = null, rawSources = null) {
  if (cur < 0) {
    chats.unshift({ title: h.slice(0, 32), msgs: [] });
    cur = 0;
  }
  chats[cur].msgs.push({ w, h, meta, rawVerdict, rawSources });
  save();
  renderList();
}

/* ==========================================================================
   8. SEND MESSAGE & REAL-TIME STREAMING SIMULATION
   ========================================================================== */
async function kirim() {
  const text = inp.value.trim();
  if (!text) return;

  sfx.playSend();
  inp.value = '';
  inp.style.height = 'auto';
  btn.disabled = true;

  appendBubble('u', text);
  pushHistory('u', text);

  // Animated Multi-Bar Waveform Indicator (Cursor & AntiGravity Style)
  const lod = document.createElement('div');
  lod.className = 'w-full flex items-start gap-3';
  lod.innerHTML = `
    <div class="w-8 h-8 rounded-xl border flex items-center justify-center text-xs font-serif italic text-slate-400 flex-shrink-0"
         style="background: var(--bg-card); border-color: var(--border-subtle);">S</div>
    <div class="flex items-center gap-3 px-4 py-2.5 rounded-2xl border text-xs font-mono"
         style="background: var(--bg-card); border-color: var(--border-subtle); color: var(--text-muted);">
      <div class="flex items-center gap-1 h-3.5">
        <span class="w-1 h-3.5 rounded-full wave-1" style="background-color: var(--accent-primary);"></span>
        <span class="w-1 h-3.5 rounded-full wave-2" style="background-color: var(--accent-primary);"></span>
        <span class="w-1 h-3.5 rounded-full wave-3" style="background-color: var(--accent-primary);"></span>
        <span class="w-1 h-3.5 rounded-full wave-4" style="background-color: var(--accent-primary);"></span>
      </div>
      <span>Memproses penalaran neural & memindai sumber fakta...</span>
    </div>
  `;
  box.appendChild(lod);
  box.scrollTop = box.scrollHeight;

  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'X-Sagi-Token': tok.value
      },
      body: JSON.stringify({
        message: text,
        session: sid
      })
    });
    const j = await res.json();
    lod.remove();

    if (!j.ok) {
      sfx.playAlert();
      const errTxt = `<div class="text-rose-400 font-mono text-xs">⚠️ Terjadi kendala engine: ${esc(j.error || 'Gagal memproses.')}</div>`;
      appendBubble('a', errTxt);
      pushHistory('a', errTxt);
      btn.disabled = false;
      inp.focus();
      return;
    }

    sfx.playReceive();

    // Stream typed response simulation
    const rawReply = j.reply || '';
    const formattedHtml = formatMarkdown(rawReply);

    appendBubble('a', formattedHtml, `${j.model_size || 'Plosagata'} · ${now()}`, j.verdict || null, j.sumber || null, true);
    pushHistory('a', formattedHtml, `${j.model_size || 'Plosagata'}`, j.verdict || null, j.sumber || null);

  } catch (err) {
    lod.remove();
    sfx.playAlert();
    const failHtml = `<div class="text-rose-400 font-mono text-xs">⚠️ Server tidak dapat dijangkau. Pastikan backend Sagi sedang berjalan.</div>`;
    appendBubble('a', failHtml);
    pushHistory('a', failHtml);
  }

  btn.disabled = false;
  inp.focus();
}

btn.onclick = kirim;
inp.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    kirim();
  }
});

/* New Chat Button */
document.getElementById('newchat').onclick = () => {
  sfx.playClick();
  cur = -1;
  sid = 's' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  localStorage.setItem('sagi_sid', sid);
  paint();
  renderList();
};

/* Keyboard Shortcut: ⌘N / Ctrl+N for new session */
window.addEventListener('keydown', e => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'n') {
    e.preventDefault();
    document.getElementById('newchat').click();
  }
});

renderList();
paint();
</script>
