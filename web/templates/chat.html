<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sagi AI — Chat Asisten Validator Berita</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0b0f19;
  --side: #080c14;
  --card: #131927;
  --card-hover: #1a2336;
  --border: rgba(255, 255, 255, 0.08);
  --border-focus: #3b82f6;
  --txt: #f8fafc;
  --mut: #94a3b8;
  --dim: #64748b;
  --acc: #3b82f6;
  --acc-glow: rgba(59, 130, 246, 0.25);
  --hoaks-bg: rgba(239, 68, 68, 0.15);
  --hoaks-border: #ef4444;
  --hoaks-txt: #fca5a5;
  --valid-bg: rgba(16, 185, 129, 0.15);
  --valid-border: #10b981;
  --valid-txt: #6ee7b7;
  --meragukan-bg: rgba(245, 158, 11, 0.15);
  --meragukan-border: #f59e0b;
  --meragukan-txt: #fde68a;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
  background: var(--bg);
  color: var(--txt);
  height: 100vh;
  display: flex;
  overflow: hidden;
}

/* Sidebar */
aside {
  width: 280px;
  background: var(--side);
  border-right: 1px solid var(--border);
  padding: 1.1rem 0.9rem;
  display: flex;
  flex-direction: column;
  gap: 0.85rem;
  flex-shrink: 0;
  transition: transform 0.25s ease;
  z-index: 50;
}
.sidebar-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 0.3rem 0.4rem;
}
.logo-wrap {
  display: flex;
  align-items: center;
  gap: 0.65rem;
  text-decoration: none;
  color: var(--txt);
}
.dot {
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: #10b981;
  box-shadow: 0 0 10px #10b981;
}
.logo-title {
  font-weight: 800;
  font-size: 1.1rem;
  letter-spacing: -0.02em;
}

#newchat {
  background: rgba(255, 255, 255, 0.04);
  color: var(--txt);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 0.65rem 0.8rem;
  cursor: pointer;
  font-size: 0.86rem;
  font-weight: 600;
  display: flex;
  align-items: center;
  gap: 0.5rem;
  transition: all 0.15s ease;
}
#newchat:hover {
  background: rgba(255, 255, 255, 0.08);
  border-color: rgba(255, 255, 255, 0.18);
}

.history-label {
  font-size: 0.72rem;
  font-weight: 600;
  color: var(--dim);
  text-transform: uppercase;
  letter-spacing: 0.05em;
  padding: 0.2rem 0.3rem 0;
}
#convs {
  flex: 1;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 0.3rem;
  padding-right: 0.2rem;
}
.conv {
  background: transparent;
  border: 1px solid transparent;
  color: var(--mut);
  text-align: left;
  padding: 0.55rem 0.75rem;
  border-radius: 9px;
  cursor: pointer;
  font-size: 0.84rem;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  transition: all 0.15s ease;
}
.conv:hover {
  background: rgba(255, 255, 255, 0.04);
  color: var(--txt);
}
.conv.on {
  background: rgba(59, 130, 246, 0.12);
  color: #fff;
  border-color: rgba(59, 130, 246, 0.3);
  font-weight: 600;
}

.sidebar-settings {
  border-top: 1px solid var(--border);
  padding-top: 0.85rem;
  display: flex;
  flex-direction: column;
  gap: 0.55rem;
}
.sidebar-settings label {
  font-size: 0.73rem;
  color: var(--dim);
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.03em;
}
.sidebar-settings select, .sidebar-settings input {
  width: 100%;
  background: rgba(11, 15, 25, 0.7);
  color: var(--txt);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 0.5rem 0.65rem;
  font-size: 0.82rem;
  font-family: inherit;
  outline: none;
}
.sidebar-settings select:focus, .sidebar-settings input:focus {
  border-color: var(--border-focus);
}
.nav-back-link {
  display: flex;
  align-items: center;
  gap: 0.4rem;
  color: var(--mut);
  text-decoration: none;
  font-size: 0.82rem;
  font-weight: 500;
  padding: 0.4rem 0.2rem;
  transition: color 0.15s ease;
}
.nav-back-link:hover {
  color: var(--txt);
}

/* Main Chat Area */
main {
  flex: 1;
  display: flex;
  flex-direction: column;
  height: 100vh;
  position: relative;
  background: radial-gradient(at 50% 0%, rgba(59, 130, 246, 0.07) 0px, transparent 60%);
}

.top-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0.8rem 1.25rem;
  border-bottom: 1px solid var(--border);
  background: rgba(11, 15, 25, 0.6);
  backdrop-filter: blur(12px);
}
.mobile-toggle {
  display: none;
  background: transparent;
  border: 1px solid var(--border);
  color: var(--txt);
  padding: 0.4rem 0.6rem;
  border-radius: 8px;
  cursor: pointer;
}
.model-indicator {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  font-size: 0.84rem;
  font-weight: 600;
  color: var(--txt);
  background: rgba(255, 255, 255, 0.04);
  padding: 0.35rem 0.8rem;
  border-radius: 99px;
  border: 1px solid var(--border);
}

#box {
  flex: 1;
  overflow-y: auto;
  padding: 1.5rem 1.25rem;
  display: flex;
  flex-direction: column;
  gap: 1.25rem;
  max-width: 860px;
  width: 100%;
  margin: 0 auto;
}

/* Messages */
.msg {
  max-width: 100%;
  line-height: 1.65;
  font-size: 0.94rem;
  animation: fadeInMsg 0.2s ease;
}
@keyframes fadeInMsg {
  from { opacity: 0; transform: translateY(6px); }
  to { opacity: 1; transform: translateY(0); }
}

.msg.user {
  align-self: flex-end;
  background: linear-gradient(135deg, #2563eb, #1d4ed8);
  color: #fff;
  padding: 0.75rem 1.15rem;
  border-radius: 18px 18px 4px 18px;
  max-width: 80%;
  box-shadow: 0 4px 16px rgba(37, 99, 235, 0.25);
}
.msg.user .time {
  font-size: 0.68rem;
  color: rgba(255, 255, 255, 0.65);
  text-align: right;
  margin-top: 0.25rem;
}

.msg.ai {
  align-self: flex-start;
  width: 100%;
  background: var(--card);
  border: 1px solid var(--border);
  padding: 1.1rem 1.25rem;
  border-radius: 18px 18px 18px 4px;
  box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
}
.msg.ai .who {
  font-weight: 700;
  font-size: 0.86rem;
  margin-bottom: 0.45rem;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.msg.ai .who-title {
  display: flex;
  align-items: center;
  gap: 0.45rem;
  color: #60a5fa;
}
.msg.ai .mini {
  font-size: 0.72rem;
  color: var(--dim);
  font-weight: 400;
}
.msg.ai .body-text {
  color: var(--txt);
  white-space: pre-wrap;
}

/* Verdict Badge in Chat */
.verd {
  margin-top: 0.85rem;
  font-size: 0.83rem;
  border-radius: 12px;
  padding: 0.65rem 0.95rem;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 0.8rem;
}
.verd.hoaks { background: var(--hoaks-bg); border: 1px solid var(--hoaks-border); color: var(--hoaks-txt); }
.verd.valid { background: var(--valid-bg); border: 1px solid var(--valid-border); color: var(--valid-txt); }
.verd.meragukan { background: var(--meragukan-bg); border: 1px solid var(--meragukan-border); color: var(--meragukan-txt); }

.badge {
  display: inline-block;
  padding: 0.2rem 0.6rem;
  border-radius: 99px;
  font-weight: 800;
  font-size: 0.72rem;
  letter-spacing: 0.04em;
}
.badge.hoaks { background: #ef4444; color: #fff; }
.badge.valid { background: #10b981; color: #fff; }
.badge.meragukan { background: #f59e0b; color: #111; }

.sources-box {
  margin-top: 0.6rem;
  font-size: 0.8rem;
  display: flex;
  flex-direction: column;
  gap: 0.35rem;
}
.source-pill {
  background: rgba(255, 255, 255, 0.04);
  border: 1px solid var(--border);
  padding: 0.35rem 0.65rem;
  border-radius: 8px;
  color: var(--mut);
}
.source-pill a {
  color: #60a5fa;
  text-decoration: none;
  font-weight: 600;
}
.source-pill a:hover {
  text-decoration: underline;
}

/* Hero / Empty state */
.hero {
  text-align: center;
  margin: auto 0;
  padding: 2rem 0;
}
.hero h2 {
  font-size: 1.8rem;
  font-weight: 800;
  letter-spacing: -0.02em;
  margin-bottom: 0.4rem;
  background: linear-gradient(135deg, #f8fafc, #94a3b8);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}
.hero p {
  color: var(--mut);
  margin-bottom: 1.5rem;
  font-size: 0.95rem;
}
.cards {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
  gap: 0.75rem;
  max-width: 640px;
  margin: 0 auto;
}
.cards button {
  background: var(--card);
  border: 1px solid var(--border);
  color: var(--txt);
  border-radius: 14px;
  padding: 0.95rem 1rem;
  cursor: pointer;
  font-size: 0.88rem;
  font-weight: 600;
  text-align: left;
  transition: all 0.2s ease;
  font-family: inherit;
}
.cards button:hover {
  background: var(--card-hover);
  border-color: rgba(255, 255, 255, 0.18);
  transform: translateY(-2px);
}
.cards small {
  display: block;
  color: var(--dim);
  font-size: 0.76rem;
  font-weight: 400;
  margin-top: 0.3rem;
}

/* Typing Indicator */
.typing {
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 0.3rem 0;
}
.typing span {
  display: inline-block;
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--acc);
  animation: bounce 1.2s infinite;
}
.typing span:nth-child(2) { animation-delay: 0.2s; }
.typing span:nth-child(3) { animation-delay: 0.4s; }
@keyframes bounce {
  0%, 100% { opacity: 0.25; transform: scale(0.8); }
  50% { opacity: 1; transform: scale(1.1); }
}

/* Composer / Input Area */
.composer-wrap {
  padding: 0 1.25rem 1rem;
  max-width: 860px;
  width: 100%;
  margin: 0 auto;
}
#composer {
  display: flex;
  align-items: flex-end;
  gap: 0.6rem;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 0.75rem 0.9rem;
  box-shadow: 0 4px 24px rgba(0, 0, 0, 0.35);
  transition: border-color 0.2s, box-shadow 0.2s;
}
#composer:focus-within {
  border-color: var(--border-focus);
  box-shadow: 0 0 0 3px var(--acc-glow);
}
#m {
  flex: 1;
  background: transparent;
  border: 0;
  color: var(--txt);
  font-size: 0.95rem;
  resize: none;
  outline: none;
  max-height: 150px;
  font-family: inherit;
  line-height: 1.5;
}
#send {
  background: linear-gradient(135deg, #2563eb, #3b82f6);
  color: #fff;
  border: 0;
  width: 38px;
  height: 38px;
  border-radius: 10px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  box-shadow: 0 2px 8px rgba(37, 99, 235, 0.4);
  transition: all 0.15s ease;
}
#send:hover:not(:disabled) {
  transform: scale(1.05);
  background: linear-gradient(135deg, #1d4ed8, #2563eb);
}
#send:disabled {
  opacity: 0.35;
  cursor: not-allowed;
}
.hint {
  text-align: center;
  color: var(--dim);
  font-size: 0.74rem;
  margin-top: 0.5rem;
}

@media(max-width: 768px) {
  aside {
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    transform: translateX(-100%);
  }
  aside.open {
    transform: translateX(0);
    box-shadow: 8px 0 32px rgba(0, 0, 0, 0.6);
  }
  .mobile-toggle {
    display: block;
  }
}
</style>
</head>
<body>

<aside id="sidebar">
  <div class="sidebar-header">
    <a href="/chat" class="logo-wrap">
      <div class="dot"></div>
      <span class="logo-title">Sagi Chat</span>
    </a>
    <button class="mobile-toggle" id="closeSidebar" style="display:none;">✕</button>
  </div>

  <button id="newchat">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    Obrolan Baru
  </button>

  <div class="history-label">Riwayat Percakapan</div>
  <div id="convs"></div>

  <div class="sidebar-settings">
    <label>Model Engine</label>
    <select id="model">
      <option value="Plosagata_Go">Plosagata_Go (Cepat / Responsif)</option>
      <option value="Plosagata_More">Plosagata_More (Medium / Penalaran)</option>
      <option value="Plosagata_Next">Plosagata_Next (Besar / Detail)</option>
    </select>

    <label>Token Remote (Opsional)</label>
    <input id="tok" type="password" placeholder="Kosongkan jika server lokal">

    <a href="/" class="nav-back-link">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg>
      Kembali ke Scanner & OCR
    </a>
  </div>
</aside>

<main>
  <div class="top-bar">
    <button class="mobile-toggle" id="openSidebar">☰</button>
    <div class="model-indicator">
      <div class="dot"></div>
      <span id="modelIndicatorText">Plosagata_Go • Aktif</span>
    </div>
    <a href="/" style="font-size:0.84rem;color:var(--mut);text-decoration:none;font-weight:600;">🛡️ Scanner Hoaks</a>
  </div>

  <div id="box"></div>

  <div class="composer-wrap">
    <div id="composer">
      <textarea id="m" rows="1" placeholder="Tanyakan kebenaran berita, tempel narasi klaim, atau sapa Sagi..."></textarea>
      <button id="send" title="Kirim Pesan">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>
      </button>
    </div>
    <div class="hint">Sagi terhubung dengan 12M Classifier & Heuristik Cek Fakta. Saring sebelum Sharing.</div>
  </div>
</main>

<script>
const box = document.getElementById('box'),
      inp = document.getElementById('m'),
      btn = document.getElementById('send'),
      sel = document.getElementById('model'),
      tok = document.getElementById('tok'),
      convs = document.getElementById('convs'),
      sidebar = document.getElementById('sidebar'),
      modelIndicatorText = document.getElementById('modelIndicatorText');

// Token & Model setting
tok.value = localStorage.getItem('sagi_token') || '';
tok.onchange = () => localStorage.setItem('sagi_token', tok.value);
sel.value = localStorage.getItem('sagi_model') || 'Plosagata_Go';
sel.onchange = () => {
  localStorage.setItem('sagi_model', sel.value);
  modelIndicatorText.innerText = sel.value + ' • Aktif';
};
modelIndicatorText.innerText = sel.value + ' • Aktif';

// Mobile sidebar
document.getElementById('openSidebar')?.addEventListener('click', () => sidebar.classList.add('open'));
document.getElementById('closeSidebar')?.addEventListener('click', () => sidebar.classList.remove('open'));

const API = new URLSearchParams(location.search).get('api') || '/api/chat';
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
const now = () => new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });

let chats = JSON.parse(localStorage.getItem('sagi_chats') || '[]');
let cur = -1;
let sid = localStorage.getItem('sagi_sid') || '';
if (!sid) {
  sid = 's' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  localStorage.setItem('sagi_sid', sid);
}

function save() {
  localStorage.setItem('sagi_chats', JSON.stringify(chats.slice(0, 20)));
}

function renderList() {
  convs.innerHTML = '';
  chats.forEach((c, i) => {
    const b = document.createElement('button');
    b.className = 'conv' + (i === cur ? ' on' : '');
    b.innerText = c.title || ('Percakapan ' + (i + 1));
    b.onclick = () => {
      cur = i;
      paint();
      renderList();
      sidebar.classList.remove('open');
    };
    convs.appendChild(b);
  });
}

function paint() {
  box.innerHTML = '';
  if (cur < 0 || !chats[cur] || !chats[cur].msgs.length) {
    hero();
    return;
  }
  chats[cur].msgs.forEach(m => bubble(m.w, m.h, m.meta || ''));
}

function hero() {
  box.innerHTML = `
    <div class="hero">
      <h2>Mau verifikasi kabar apa hari ini?</h2>
      <p>Tempel klaim atau tanyakan berita viral. Sagi akan menganalisis kebenarannya.</p>
      <div class="cards">
        <button data-q="Bener gak giveaway iPhone 15 gratis cuma klik link dan masukin OTP?">
          🔍 Cek Giveaway Palsu
          <small>Indikasi phishing link berhadiah</small>
        </button>
        <button data-q="Sagi, bener gak bansos BLT Kemensos cair minggu ini?">
          💰 Verifikasi Bantuan Sosial
          <small>Cek info resmi kemensos.go.id</small>
        </button>
        <button data-q="Beneran gak minum rebusan paku bisa sembuhin kanker?">
          ⚠️ Klarifikasi Hoaks Medis
          <small>Klaim pengobatan tanpa bukti dokter</small>
        </button>
        <button data-q="Tolong buatkan kode python untuk kalkulator">
          ⛔ Tes Batasan Topik
          <small>Lihat respons Sagi saat menolak sopan</small>
        </button>
      </div>
    </div>
  `;
  box.querySelectorAll('[data-q]').forEach(b => {
    b.onclick = () => {
      inp.value = b.dataset.q;
      kirim();
    };
  });
}

function bubble(who, htmlContent, meta) {
  if (who === 'u') {
    box.insertAdjacentHTML('beforeend', `
      <div class="msg user">
        <div>${esc(htmlContent)}</div>
        <div class="time">${now()}</div>
      </div>
    `);
  } else {
    box.insertAdjacentHTML('beforeend', `
      <div class="msg ai">
        <div class="who">
          <span class="who-title">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></svg>
            Sagi AI
          </span>
          <span class="mini">${meta || now()}</span>
        </div>
        <div class="body-text">${htmlContent}</div>
      </div>
    `);
  }
  box.scrollTop = box.scrollHeight;
}

function push(w, h, meta) {
  if (cur < 0) {
    chats.unshift({ title: h.slice(0, 30), msgs: [] });
    cur = 0;
  }
  chats[cur].msgs.push({ w, h, meta });
  save();
  renderList();
}

async function kirim() {
  const text = inp.value.trim();
  if (!text) return;
  inp.value = '';
  inp.style.height = 'auto';
  btn.disabled = true;

  bubble('u', text);
  push('u', text);

  // Loading indicator
  const lod = document.createElement('div');
  lod.className = 'msg ai';
  lod.innerHTML = `
    <div class="who"><span class="who-title">Sagi AI</span></div>
    <div class="typing"><span></span><span></span><span></span></div>
  `;
  box.appendChild(lod);
  box.scrollTop = box.scrollHeight;

  try {
    const res = await fetch(API, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'X-Sagi-Token': tok.value
      },
      body: JSON.stringify({
        message: text,
        model: sel.value,
        session: sid
      })
    });
    const j = await res.json();
    lod.remove();

    if (!j.ok) {
      const errTxt = '⚠️ ' + esc(j.error || 'Gagal memproses respons.');
      bubble('a', errTxt);
      push('a', errTxt);
      return;
    }

    let extra = '';
    if (j.verdict) {
      const v = j.verdict;
      const vLabel = (v.label || 'meragukan').toLowerCase();
      extra += `
        <div class="verd ${vLabel}">
          <div>
            <span class="badge ${vLabel}">${vLabel.toUpperCase()}</span>
            <b>Skor: ${v.skor}/100</b> • ${esc(v.kesimpulan)}
          </div>
        </div>
      `;
    }

    if (j.sumber) {
      let srcHtml = '';
      (j.sumber.wikipedia || []).forEach(s => {
        srcHtml += `<div class="source-pill">📖 Wikipedia: <a href="${s.url}" target="_blank">${esc(s.judul)}</a> — ${esc(s.cuplikan || '')}</div>`;
      });
      (j.sumber.cek_fakta || []).forEach(s => {
        srcHtml += `<div class="source-pill">✅ Cek Fakta: <a href="${s.url}" target="_blank">${esc(s.judul)}</a></div>`;
      });
      if (srcHtml) extra += `<div class="sources-box">${srcHtml}</div>`;
    }

    const finalHtml = esc(j.reply) + extra;
    bubble('a', finalHtml, `${sel.value} • ${now()}`);
    push('a', finalHtml, sel.value);
  } catch (err) {
    lod.remove();
    const failHtml = '⚠️ Gagal terhubung ke server Sagi. Pastikan Flask sedang berjalan.';
    bubble('a', failHtml);
    push('a', failHtml);
  }

  btn.disabled = false;
  inp.focus();
}

btn.onclick = kirim;
inp.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    kirim();
  }
});
inp.addEventListener('input', () => {
  inp.style.height = 'auto';
  inp.style.height = Math.min(150, inp.scrollHeight) + 'px';
});

document.getElementById('newchat').onclick = () => {
  cur = -1;
  sid = 's' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  localStorage.setItem('sagi_sid', sid);
  paint();
  renderList();
};

renderList();
paint();
</script>
</body>
</html>
