<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sagi — Chat Validator Berita</title>
<style>
:root{--bg:#212121;--side:#171717;--card:#2f2f2f;--me:#2f2f2f;--ai:transparent;
--txt:#ececec;--mut:#9b9b9b;--acc:#10a37f;--line:#424242}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--txt);height:100vh;display:flex}
aside{width:260px;background:var(--side);padding:.8rem;display:flex;flex-direction:column;gap:.6rem;flex-shrink:0}
aside .logo{display:flex;align-items:center;gap:.6rem;font-weight:700;font-size:1.05rem;padding:.3rem .4rem}
.dot{width:14px;height:14px;border-radius:50%;background:var(--acc);box-shadow:0 0 10px var(--acc)}
#newchat{background:transparent;color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:.6rem;cursor:pointer;font-size:.9rem}
#newchat:hover{background:#222}
#convs{flex:1;overflow:auto;display:flex;flex-direction:column;gap:.25rem}
.conv{background:transparent;border:0;color:var(--txt);text-align:left;padding:.55rem .6rem;border-radius:8px;cursor:pointer;font-size:.85rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.conv:hover{background:#222}.conv.on{background:#2c2c2c}
aside label{font-size:.72rem;color:var(--mut)}
aside select,aside input{width:100%;background:#222;color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:.5rem;font-size:.8rem}
main{flex:1;display:flex;flex-direction:column;max-width:820px;margin:0 auto;width:100%;padding:0 1rem}
#box{flex:1;overflow:auto;padding:1.2rem .3rem;display:flex;flex-direction:column;gap:1rem}
.msg{max-width:100%;line-height:1.65;font-size:.95rem}
.msg.user{align-self:flex-end;background:var(--card);padding:.6rem 1rem;border-radius:18px;max-width:85%}
.msg.ai{align-self:flex-start;width:100%}
.msg.ai .who{font-weight:700;margin-bottom:.25rem;display:flex;align-items:center;gap:.5rem}
.msg.ai .who .mini{font-size:.7rem;color:var(--mut);font-weight:400}
.verd{margin-top:.5rem;font-size:.8rem;background:#1c2b22;border:1px solid #2c4a38;border-radius:10px;padding:.5rem .8rem;display:inline-block}
.badge{display:inline-block;padding:.1rem .55rem;border-radius:99px;font-weight:700;font-size:.72rem}
.hoaks{background:#5a1f1f;color:#ffb4b4}.valid{background:#1d4a2a;color:#b6f0c6}.meragukan{background:#5a4a17;color:#ffe9a8}
.copy{background:transparent;border:1px solid var(--line);color:var(--mut);border-radius:6px;font-size:.7rem;padding:.15rem .5rem;cursor:pointer}
.hero{text-align:center;margin:auto 0;padding:2rem 0}
.hero h2{font-size:1.6rem;margin-bottom:.4rem}.hero p{color:var(--mut);margin-bottom:1.2rem}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:.6rem;max-width:560px;margin:0 auto}
.cards button{background:transparent;border:1px solid var(--line);color:var(--txt);border-radius:12px;padding:.8rem;cursor:pointer;font-size:.85rem;text-align:left}
.cards button:hover{background:#2a2a2a}
.cards small{display:block;color:var(--mut);margin-top:.25rem}
.typing span{display:inline-block;width:7px;height:7px;margin:0 2px;border-radius:50%;background:var(--mut);animation:bl 1s infinite}
.typing span:nth-child(2){animation-delay:.2s}.typing span:nth-child(3){animation-delay:.4s}
@keyframes bl{0%,100%{opacity:.3}50%{opacity:1}}
#composer{display:flex;gap:.5rem;background:var(--card);border-radius:16px;padding:.6rem;margin:.6rem 0 1rem}
#m{flex:1;background:transparent;border:0;color:var(--txt);font-size:.95rem;resize:none;outline:none;max-height:140px;font-family:inherit}
#send{background:var(--txt);color:#111;border:0;width:36px;height:36px;border-radius:50%;cursor:pointer;font-size:1rem;flex-shrink:0}
#send:disabled{opacity:.4}
.hint{text-align:center;color:var(--mut);font-size:.72rem;padding-bottom:.8rem}
a{color:#8fb0ff}
@media(max-width:700px){aside{display:none}}
</style>
</head>
<body>
<aside>
<div class="logo"><div class="dot"></div>Sagi <small style="color:var(--mut)">validator berita</small></div>
<button id="newchat">＋ Chat baru</button>
<div id="convs"></div>
<label>Model</label>
<select id="model">
<option value="Plosagata_Go">Plosagata_Go — cepat</option>
<option value="Plosagata_More">Plosagata_More — medium</option>
<option value="Plosagata_Next">Plosagata_Next — besar</option>
</select>
<label>Token (server remote)</label>
<input id="tok" type="password" placeholder="kosongkan jika lokal">
<div style="font-size:.75rem"><a href="/">← validator</a></div>
</aside>
<main>
<div id="box"></div>
<div id="composer"><textarea id="m" rows="1" placeholder="Tempel berita atau ketik pesan..."></textarea><button id="send">↑</button></div>
<div class="hint">Sagi hanya membahas berita & cek fakta. Saring sebelum Sharing.</div>
</main>
<script>
const box=document.getElementById('box'),inp=document.getElementById('m'),
btn=document.getElementById('send'),sel=document.getElementById('model'),
tok=document.getElementById('tok'),convs=document.getElementById('convs');
tok.value=localStorage.getItem('sagi_token')||'';
tok.onchange=()=>localStorage.setItem('sagi_token',tok.value);
const API=new URLSearchParams(location.search).get('api')||'/api/chat';
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
const now=()=>new Date().toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'});
let chats=JSON.parse(localStorage.getItem('sagi_chats')||'[]'),cur=-1;
function save(){localStorage.setItem('sagi_chats',JSON.stringify(chats.slice(0,20)));}
function renderList(){convs.innerHTML='';chats.forEach((c,i)=>{const b=document.createElement('button');
b.className='conv'+(i===cur?' on':'');b.innerText=(c.title||'Chat '+(i+1));b.onclick=()=>{cur=i;paint();renderList();};convs.appendChild(b);});}
function paint(){box.innerHTML='';
if(cur<0||!chats[cur]||!chats[cur].msgs.length){hero();return;}
chats[cur].msgs.forEach(m=>bubble(m.w,m.h,m.meta||''));}
function hero(){box.innerHTML=`<div class="hero"><h2>Ada berita yang meragukan?</h2>
<p>Tempel klaimnya — Sagi cek kebenarannya.</p><div class="cards">
<button data-q="Bener gak giveaway iPhone gratis klik link ini?">🔍 Cek hoaks<small>contoh klaim giveaway</small></button>
<button data-q="Sagi, bener gak BLT cair bulan ini?">💰 Cek bansos<small>contoh klaim bantuan</small></button>
<button data-q="Gimana cara bedakan berita hoaks?">📖 Cara cek fakta<small>panduan singkat</small></button>
<button data-q="Buatkan kode python">⛔ Tes batasan<small>lihat Sagi menolak</small></button>
</div></div>`;
box.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{inp.value=b.dataset.q;kirim();});}
function bubble(w,h,meta){box.insertAdjacentHTML('beforeend',
w==='u'?`<div class="msg user">${esc(h)}<div style="font-size:.7rem;color:var(--mut);text-align:right">${now()}</div></div>`
:`<div class="msg ai"><div class="who">◆ Sagi ${meta}</div><div>${h}</div></div>`);
box.scrollTop=box.scrollHeight;}
function push(w,h,meta){if(cur<0){chats.unshift({title:h.slice(0,32),msgs:[]});cur=0;}
chats[cur].msgs.push({w,h,meta});save();renderList();}
async function kirim(){const t=inp.value.trim();if(!t)return;inp.value='';inp.style.height='auto';btn.disabled=true;
bubble('u',esc(t));push('u',esc(t));
const lod=document.createElement('div');lod.className='msg ai';
lod.innerHTML='<div class="who">◆ Sagi</div><div class="typing"><span></span><span></span><span></span></div>';
box.appendChild(lod);box.scrollTop=box.scrollHeight;
try{const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json','X-Sagi-Token':tok.value},
body:JSON.stringify({message:t,model:sel.value})});
const j=await r.json();lod.remove();
if(!j.ok){const h='⚠️ '+esc(j.error||'Gagal');bubble('a',h);push('a',h);return;}
let extra='';
if(j.verdict)extra=`<div class="verd"><span class="badge ${j.verdict.label}">${j.verdict.label.toUpperCase()}</span> skor ${j.verdict.skor} • ${esc(j.verdict.kesimpulan)} <button class="copy" onclick="navigator.clipboard.writeText(this.parentNode.innerText)">salin</button></div>`;
if(j.sumber){(j.sumber.wikipedia||[]).forEach(s=>{const t=s.url?`<a href="${s.url}" target="_blank">${esc(s.judul)}</a>`:esc(s.judul);extra+=`<div class="meta">📖 ${t} — ${esc(s.cuplikan||'')}</div>`;});
(j.sumber.cek_fakta||[]).forEach(s=>{extra+=`<div class="meta">✅ <a href="${s.url}" target="_blank">${esc(s.judul)}</a></div>`;});}
const h=esc(j.reply)+extra;
bubble('a',h,`<span class="mini">${sel.value} • ${now()}</span>`);push('a',h,sel.value);
}catch(e){lod.remove();const h='⚠️ Server tidak merespons.';bubble('a',h);push('a',h);}
btn.disabled=false;inp.focus();}
btn.onclick=kirim;
inp.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();kirim();}});
inp.addEventListener('input',()=>{inp.style.height='auto';inp.style.height=Math.min(140,inp.scrollHeight)+'px';});
document.getElementById('newchat').onclick=()=>{cur=-1;paint();renderList();};
renderList();paint();
</script>
</body>
</html>
