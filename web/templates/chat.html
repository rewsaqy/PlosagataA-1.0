<!doctype html>
<html lang="id" class="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sagi Neural — AI News & Fact Verification</title>

<!-- Fonts: Instrument Serif / Plus Jakarta Sans & JetBrains Mono -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<!-- Tailwind CSS via Official CDN -->
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  darkMode: 'class',
  theme: {
    extend: {
      fontFamily: {
        sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'],
        serif: ['"Instrument Serif"', 'Georgia', 'serif'],
        mono: ['"JetBrains Mono"', 'monospace'],
      },
      colors: {
        obsidian: {
          950: '#090a0f',
          900: '#0f1118',
          850: '#141722',
          800: '#1a1e2c',
          700: '#262c3f',
          600: '#353c54',
        },
        champagne: {
          100: '#fdfbf7',
          200: '#f7f1e6',
          300: '#eedec5',
          400: '#e3c59a',
          500: '#d4a86a',
          600: '#bc8a4b',
        },
        brand: {
          bronze: '#d4a86a',
          copper: '#c27847',
          terracotta: '#bc544b',
          sage: '#4e8774',
          crimson: '#b94747',
          amber: '#c78635',
        }
      },
      boxShadow: {
        'glow-bronze': '0 0 24px -4px rgba(212, 168, 106, 0.15)',
        'glow-subtle': '0 0 40px -10px rgba(255, 255, 255, 0.03)',
        'dock': '0 20px 40px -15px rgba(0, 0, 0, 0.7)',
      }
    }
  }
}
</script>

<style>
/* Custom Architectural Micro-Details */
::selection {
  background: rgba(212, 168, 106, 0.25);
  color: #fff;
}
::-webkit-scrollbar {
  width: 5px;
  height: 5px;
}
::-webkit-scrollbar-track {
  background: transparent;
}
::-webkit-scrollbar-thumb {
  background: rgba(255, 255, 255, 0.08);
  border-radius: 99px;
}
::-webkit-scrollbar-thumb:hover {
  background: rgba(255, 255, 255, 0.16);
}

.bg-dot-matrix {
  background-image: radial-gradient(rgba(255, 255, 255, 0.06) 1px, transparent 1px);
  background-size: 24px 24px;
}

@keyframes pulseSubtle {
  0%, 100% { opacity: 0.4; }
  50% { opacity: 1; }
}
.animate-pulse-subtle {
  animation: pulseSubtle 3s cubic-bezier(0.4, 0, 0.6, 1) infinite;
}

@keyframes waveBar {
  0%, 100% { transform: scaleY(0.3); }
  50% { transform: scaleY(1); }
}
.wave-1 { animation: waveBar 1s ease-in-out infinite; }
.wave-2 { animation: waveBar 1s ease-in-out infinite 0.2s; }
.wave-3 { animation: waveBar 1s ease-in-out infinite 0.4s; }
</style>
</head>

<body class="bg-obsidian-950 text-slate-100 font-sans h-screen flex overflow-hidden antialiased selection:bg-brand-bronze/20 selection:text-champagne-200">

<!-- SIDEBAR (Antigravity & Opencode Inspired) -->
<aside id="sidebar" class="w-72 bg-obsidian-900 border-r border-white/[0.06] p-4 flex flex-col gap-4 flex-shrink-0 transition-transform duration-300 z-50 md:translate-x-0 -translate-x-full fixed md:relative h-full">
  
  <!-- Logo & Version Tag -->
  <div class="flex items-center justify-between pb-3 border-b border-white/[0.05]">
    <a href="/chat" class="flex items-center gap-3 group">
      <!-- Monogram Glyph -->
      <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-obsidian-800 to-obsidian-850 border border-brand-bronze/40 flex items-center justify-center shadow-glow-bronze group-hover:border-brand-bronze transition-colors">
        <span class="font-serif italic text-brand-bronze text-lg font-bold">S</span>
      </div>
      <div>
        <div class="flex items-center gap-1.5">
          <span class="font-semibold text-sm tracking-tight text-slate-100">Sagi Neural</span>
          <span class="text-[10px] font-mono px-1.5 py-0.5 rounded bg-brand-bronze/10 text-brand-bronze border border-brand-bronze/20">v1.2</span>
        </div>
        <p class="text-[11px] text-slate-400 font-mono tracking-wider">HYBRID VERIFIER</p>
      </div>
    </a>
    <button id="closeSidebar" class="md:hidden text-slate-400 hover:text-white p-1 rounded-md">✕</button>
  </div>

  <!-- New Chat Button (Command Palette Style) -->
  <button id="newchat" class="w-full flex items-center justify-between px-3 py-2.5 rounded-xl bg-white/[0.03] hover:bg-white/[0.07] border border-white/[0.07] hover:border-white/[0.14] text-xs font-medium text-slate-200 transition-all group shadow-sm">
    <div class="flex items-center gap-2.5">
      <svg class="w-4 h-4 text-brand-bronze" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/>
      </svg>
      <span>Sesi Percakapan Baru</span>
    </div>
    <kbd class="text-[10px] font-mono text-slate-400 bg-white/[0.04] px-1.5 py-0.5 rounded border border-white/[0.06] group-hover:text-slate-300">⌘N</kbd>
  </button>

  <!-- History Group List -->
  <div class="flex-1 flex flex-col min-h-0">
    <div class="flex items-center justify-between px-1 py-1 text-[11px] font-mono text-slate-400 uppercase tracking-wider">
      <span>Riwayat Cek Fakta</span>
      <span class="text-[10px] text-slate-500" id="chatCount">0 sesi</span>
    </div>
    <div id="convs" class="flex-1 overflow-y-auto space-y-1 pr-1 mt-1">
      <!-- Dynamic chat sessions populated via JS -->
    </div>
  </div>

  <!-- Bottom Configurations (Opencode Inspector Style) -->
  <div class="pt-3 border-t border-white/[0.05] space-y-3">
    
    <!-- Model Engine Selector -->
    <div>
      <div class="flex items-center justify-between mb-1.5">
        <label class="text-[11px] font-mono text-slate-400 uppercase tracking-wider flex items-center gap-1.5">
          <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
          Engine Model
        </label>
        <span class="text-[10px] font-mono text-slate-400">12M + RAG</span>
      </div>
      <div class="relative">
        <div id="activeModel" class="w-full bg-obsidian-850 text-xs font-mono text-slate-200 border border-white/[0.08] rounded-lg px-3 py-2">
          …memuat model aktif…
        </div>
      </div>
      <a href="/models" class="text-[11px] font-mono text-brand-bronze hover:underline">Ganti model → /models</a>
    </div>

    <!-- Remote Token (Collapsible subtle) -->
    <div>
      <details class="group">
        <summary class="text-[11px] font-mono text-slate-400 hover:text-slate-300 cursor-pointer flex items-center justify-between py-0.5">
          <span>Auth Token (Remote)</span>
          <span class="text-[10px] text-slate-500 group-open:rotate-180 transition-transform">▼</span>
        </summary>
        <div class="mt-2">
          <input id="tok" type="password" placeholder="X-Sagi-Token..." class="w-full bg-obsidian-850 text-xs font-mono text-slate-200 placeholder:text-slate-400 border border-white/[0.08] rounded-lg px-3 py-1.5 outline-none focus:border-brand-bronze/50">
        </div>
      </details>
    </div>

    <!-- Navigation to Scanner (Claude / Antigravity style switch) -->
    <a href="/" class="flex items-center justify-between px-3 py-2 rounded-lg bg-white/[0.02] hover:bg-white/[0.05] border border-white/[0.05] hover:border-white/[0.1] text-xs text-slate-300 transition-colors">
      <div class="flex items-center gap-2">
        <svg class="w-4 h-4 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
        </svg>
        <span>Mode Scanner & OCR</span>
      </div>
      <span class="text-slate-500 text-xs">→</span>
    </a>

  </div>
</aside>

<!-- MAIN WORKSPACE -->
<main class="flex-1 flex flex-col h-full bg-obsidian-950 bg-dot-matrix relative overflow-hidden">
  
  <!-- Subtle Ambient Glow (Warm Ochre / Champagne) -->
  <div class="pointer-events-none absolute top-0 left-1/2 -translate-x-1/2 w-[700px] h-[350px] bg-brand-bronze/[0.03] blur-[120px] rounded-full"></div>

  <!-- Top Navigation Header -->
  <header class="h-14 border-b border-white/[0.05] bg-obsidian-950/80 backdrop-blur-md px-4 sm:px-8 flex items-center justify-between flex-shrink-0 z-20">
    <div class="flex items-center gap-3">
      <button id="openSidebar" class="md:hidden text-slate-400 hover:text-white p-1.5 rounded-lg border border-white/[0.08] bg-obsidian-900">
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"/>
        </svg>
      </button>

      <!-- Engine Breadcrumb Indicator -->
      <div class="flex items-center gap-2 text-xs font-mono">
        <span class="text-slate-400">workspace</span>
        <span class="text-slate-600">/</span>
        <span class="text-slate-300 font-medium flex items-center gap-1.5">
          <span class="w-2 h-2 rounded-full bg-brand-bronze/80"></span>
          <span id="modelIndicatorText">Plosagata_Go</span>
        </span>
      </div>
    </div>

    <!-- Status Badges -->
    <div class="flex items-center gap-3">
      <div class="hidden sm:flex items-center gap-2 px-2.5 py-1 rounded-full bg-white/[0.03] border border-white/[0.06] text-[11px] font-mono text-slate-400">
        <span class="w-1.5 h-1.5 rounded-full bg-emerald-400"></span>
        <span>Local CPU · ~12ms</span>
      </div>
      <a href="/" class="text-xs font-medium text-slate-400 hover:text-slate-200 transition-colors flex items-center gap-1">
        <span>Buka Scanner</span>
        <span class="font-mono text-[10px]">↗</span>
      </a>
    </div>
  </header>

  <!-- Chat Scroll Area -->
  <div id="box" class="flex-1 overflow-y-auto px-4 sm:px-8 py-6 space-y-6 max-w-4xl w-full mx-auto">
    <!-- Populated dynamically via JS -->
  </div>

  <!-- Bottom Floating Composer (Claude / ChatGPT 4o Refined) -->
  <div class="p-4 sm:p-6 max-w-4xl w-full mx-auto flex-shrink-0 relative z-20">
    <div class="bg-obsidian-900/90 backdrop-blur-xl border border-white/[0.1] focus-within:border-brand-bronze/60 rounded-2xl p-2.5 sm:p-3 shadow-dock transition-all group">
      
      <div class="flex items-end gap-3">
        <!-- Input Textarea -->
        <textarea id="m" rows="1" placeholder="Tempel narasi berita, klaim viral, atau tanyakan fakta..." class="w-full bg-transparent text-sm sm:text-[15px] text-slate-100 placeholder:text-slate-400 outline-none resize-none max-h-40 leading-relaxed py-1.5 px-2 font-sans"></textarea>
        
        <!-- Send Action -->
        <button id="send" title="Kirim Pesan (Enter)" class="w-9 h-9 rounded-xl bg-champagne-300 hover:bg-champagne-400 disabled:bg-white/[0.08] disabled:text-slate-600 text-obsidian-950 flex items-center justify-center flex-shrink-0 transition-all font-bold shadow-sm">
          <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M5 10l7-7m0 0l7 7m-7-7v18"/>
          </svg>
        </button>
      </div>

      <!-- Composer Meta Bar -->
      <div class="flex items-center justify-between pt-2 px-2 border-t border-white/[0.04] mt-2 text-[11px] font-mono text-slate-400">
        <div class="flex items-center gap-2">
          <span>Saring Sebelum Sharing</span>
          <span class="text-slate-700">·</span>
          <span class="hidden sm:inline">12M Encoder + RAG Heuristik</span>
        </div>
        <div class="flex items-center gap-2 text-slate-400">
          <span class="hidden sm:inline">Kirim</span>
          <kbd class="px-1.5 py-0.5 rounded bg-white/[0.05] border border-white/[0.06] text-[10px]">Enter ↵</kbd>
        </div>
      </div>

    </div>
  </div>

</main>

<script>
const box = document.getElementById('box'),
      inp = document.getElementById('m'),
      btn = document.getElementById('send'),
      tok = document.getElementById('tok'),
      convs = document.getElementById('convs'),
      sidebar = document.getElementById('sidebar'),
      chatCount = document.getElementById('chatCount'),
      modelIndicatorText = document.getElementById('modelIndicatorText');

// Persisted Preferences
tok.value = localStorage.getItem('sagi_token') || '';
tok.onchange = () => localStorage.setItem('sagi_token', tok.value);

// Model aktif = keputusan server (/api/models), bukan dropdown lokal.
async function refreshActive(){
  try{
    const j = await (await fetch('/api/models')).json();
    document.getElementById('activeModel').innerText = j.active + ' ● AKTIF';
    modelIndicatorText.innerText = j.active;
  }catch(e){ document.getElementById('activeModel').innerText = 'tak tersambung'; }
}
refreshActive();

// Mobile Drawer Controls
document.getElementById('openSidebar')?.addEventListener('click', () => sidebar.classList.remove('-translate-x-full'));
document.getElementById('closeSidebar')?.addEventListener('click', () => sidebar.classList.add('-translate-x-full'));

const API = new URLSearchParams(location.search).get('api') || '/api/chat';
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
const now = () => new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });

let chats = JSON.parse(localStorage.getItem('sagi_chats') || '[]');
let cur = -1;
let sid = localStorage.getItem('sagi_sid') || '';
if (!sid) {
  sid = 's' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  localStorage.setItem('sagi_sid', sid);
}

function save() {
  localStorage.setItem('sagi_chats', JSON.stringify(chats.slice(0, 30)));
}

function renderList() {
  convs.innerHTML = '';
  chatCount.innerText = `${chats.length} sesi`;
  if (!chats.length) {
    convs.innerHTML = '<div class="text-[11px] font-mono text-slate-400 py-3 px-2">Belum ada sesi tersimpan.</div>';
    return;
  }
  chats.forEach((c, i) => {
    const b = document.createElement('button');
    const isActive = i === cur;
    b.className = `w-full text-left px-2.5 py-2 rounded-lg text-xs truncate transition-colors flex items-center justify-between group ${
      isActive 
        ? 'bg-brand-bronze/15 text-champagne-300 font-medium border border-brand-bronze/30' 
        : 'text-slate-400 hover:text-slate-200 hover:bg-white/[0.04]'
    }`;
    b.innerHTML = `
      <span class="truncate">${esc(c.title || 'Percakapan ' + (i + 1))}</span>
      <span class="text-[10px] font-mono text-slate-400 opacity-0 group-hover:opacity-100 transition-opacity">#${i+1}</span>
    `;
    b.onclick = () => {
      cur = i;
      paint();
      renderList();
      sidebar.classList.add('-translate-x-full');
    };
    convs.appendChild(b);
  });
}

function paint() {
  box.innerHTML = '';
  if (cur < 0 || !chats[cur] || !chats[cur].msgs.length) {
    renderHero();
    return;
  }
  chats[cur].msgs.forEach(m => appendBubble(m.w, m.h, m.meta || ''));
}

function renderHero() {
  box.innerHTML = `
    <div class="my-auto py-8 sm:py-16 text-center max-w-2xl mx-auto space-y-6">
      
      <!-- Brand Emblem -->
      <div class="inline-flex items-center gap-2 px-3 py-1.5 rounded-full bg-white/[0.03] border border-white/[0.08] text-xs font-mono text-brand-bronze">
        <span class="w-1.5 h-1.5 rounded-full bg-brand-bronze"></span>
        <span>PLOSAGATA ARCHITECTURE · 12M HYBRID</span>
      </div>

      <!-- Editorial Title -->
      <div class="space-y-2">
        <h1 class="text-3xl sm:text-5xl font-serif font-normal tracking-tight text-slate-100">
          Verifikasi Berita & Cek Fakta
        </h1>
        <p class="text-sm sm:text-base text-slate-400 max-w-md mx-auto font-light leading-relaxed">
          Tempel narasi mencurigakan dari WhatsApp, media sosial, atau media massa. Sagi membedah keaslian klaim secara objektif.
        </p>
      </div>

      <!-- Quick Exploration Cards (Claude / Opencode Style) -->
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 pt-4 text-left">
        
        <button data-q="Bener gak giveaway iPhone 15 gratis cuma klik link bit.ly dan masukkan OTP?" class="card-prompt p-3.5 rounded-xl bg-obsidian-900/60 hover:bg-obsidian-850 border border-white/[0.06] hover:border-brand-bronze/40 transition-all group">
          <div class="flex items-center justify-between text-xs font-mono text-slate-400 mb-1">
            <span class="text-rose-400 font-semibold">🔴 Phishing & Scam</span>
            <span class="group-hover:translate-x-0.5 transition-transform">→</span>
          </div>
          <div class="text-xs text-slate-200 font-medium">Bocoran giveaway iPhone klik tautan mencurigakan</div>
          <div class="text-[11px] text-slate-400 mt-1">Deteksi pola phishing OTP perbankan</div>
        </button>

        <button data-q="Pemerintah resmi menyalurkan bansos BLT melalui kantor pos menurut situs resmi kemensos.go.id" class="card-prompt p-3.5 rounded-xl bg-obsidian-900/60 hover:bg-obsidian-850 border border-white/[0.06] hover:border-brand-bronze/40 transition-all group">
          <div class="flex items-center justify-between text-xs font-mono text-slate-400 mb-1">
            <span class="text-emerald-400 font-semibold">🟢 Kebijakan Resmi</span>
            <span class="group-hover:translate-x-0.5 transition-transform">→</span>
          </div>
          <div class="text-xs text-slate-200 font-medium">Penyaluran BLT Kemensos via Kantor Pos</div>
          <div class="text-[11px] text-slate-400 mt-1">Uji domain kementerian .go.id</div>
        </button>

        <button data-q="VIRAL! Minum rebusan paku dan daun sirih menyembuhkan kanker dalam 3 hari, sebarkan sebelum dihapus!" class="card-prompt p-3.5 rounded-xl bg-obsidian-900/60 hover:bg-obsidian-850 border border-white/[0.06] hover:border-brand-bronze/40 transition-all group">
          <div class="flex items-center justify-between text-xs font-mono text-slate-400 mb-1">
            <span class="text-amber-400 font-semibold">🟡 Hoaks Kesehatan</span>
            <span class="group-hover:translate-x-0.5 transition-transform">→</span>
          </div>
          <div class="text-xs text-slate-200 font-medium">Klaim obat ajaib kanker tanpa uji medis</div>
          <div class="text-[11px] text-slate-400 mt-1">Analisis kata kunci manipulatif</div>
        </button>

        <button data-q="Tolong buatkan kode python untuk game ular" class="card-prompt p-3.5 rounded-xl bg-obsidian-900/60 hover:bg-obsidian-850 border border-white/[0.06] hover:border-brand-bronze/40 transition-all group">
          <div class="flex items-center justify-between text-xs font-mono text-slate-400 mb-1">
            <span class="text-slate-400 font-semibold">⛔ Guardrail Uji Batasan</span>
            <span class="group-hover:translate-x-0.5 transition-transform">→</span>
          </div>
          <div class="text-xs text-slate-200 font-medium">Instruksi pemrograman di luar ranah berita</div>
          <div class="text-[11px] text-slate-400 mt-1">Uji sistem penolakan sopan</div>
        </button>

      </div>
    </div>
  `;

  box.querySelectorAll('.card-prompt').forEach(b => {
    b.onclick = () => {
      inp.value = b.dataset.q;
      kirim();
    };
  });
}

function appendBubble(who, htmlContent, meta) {
  const isUser = who === 'u';
  const row = document.createElement('div');
  row.className = `flex flex-col ${isUser ? 'items-end' : 'items-start'} space-y-1.5`;

  if (isUser) {
    row.innerHTML = `
      <div class="max-w-[85%] sm:max-w-[75%] rounded-2xl rounded-tr-sm bg-obsidian-850 border border-white/[0.08] px-4 py-3 text-sm text-slate-100 shadow-sm leading-relaxed">
        ${esc(htmlContent)}
      </div>
      <div class="text-[10px] font-mono text-slate-400 px-1">${now()}</div>
    `;
  } else {
    row.innerHTML = `
      <div class="w-full flex items-start gap-3">
        <!-- Avatar Glyph -->
        <div class="w-7 h-7 rounded-lg bg-obsidian-850 border border-brand-bronze/40 flex items-center justify-center text-xs font-serif italic text-brand-bronze font-bold flex-shrink-0 mt-0.5">
          S
        </div>
        
        <div class="flex-1 space-y-2 max-w-full">
          <div class="flex items-center gap-2">
            <span class="text-xs font-semibold text-slate-200">Sagi AI</span>
            <span class="text-[10px] font-mono text-slate-400">${meta || now()}</span>
          </div>

          <div class="bg-obsidian-900/70 border border-white/[0.07] rounded-2xl rounded-tl-sm p-4 sm:p-5 text-sm text-slate-200 leading-relaxed shadow-sm space-y-3">
            <div>${htmlContent}</div>
          </div>
        </div>
      </div>
    `;
  }

  box.appendChild(row);
  box.scrollTop = box.scrollHeight;
}

function pushHistory(w, h, meta) {
  if (cur < 0) {
    chats.unshift({ title: h.slice(0, 34), msgs: [] });
    cur = 0;
  }
  chats[cur].msgs.push({ w, h, meta });
  save();
  renderList();
}

async function kirim() {
  const text = inp.value.trim();
  if (!text) return;
  inp.value = '';
  inp.style.height = 'auto';
  btn.disabled = true;

  appendBubble('u', text);
  pushHistory('u', text);

  // Animated Waveform Loading (Antigravity Style)
  const lod = document.createElement('div');
  lod.className = 'flex items-center gap-3';
  lod.innerHTML = `
    <div class="w-7 h-7 rounded-lg bg-obsidian-850 border border-white/[0.08] flex items-center justify-center text-xs font-serif italic text-slate-400">S</div>
    <div class="flex items-center gap-1.5 px-3 py-2 rounded-xl bg-obsidian-900/60 border border-white/[0.06] text-xs font-mono text-slate-400">
      <div class="flex items-center gap-1 h-3">
        <span class="w-1 h-3 bg-brand-bronze/60 rounded-full wave-1"></span>
        <span class="w-1 h-3 bg-brand-bronze/60 rounded-full wave-2"></span>
        <span class="w-1 h-3 bg-brand-bronze/60 rounded-full wave-3"></span>
      </div>
      <span>Menganalisis klaim & memindai sumber...</span>
    </div>
  `;
  box.appendChild(lod);
  box.scrollTop = box.scrollHeight;

  try {
    const res = await fetch(API, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'X-Sagi-Token': tok.value
      },
      body: JSON.stringify({
        message: text,
        session: sid
      })
    });
    const j = await res.json();
    lod.remove();

    if (!j.ok) {
      const errTxt = `<div class="text-rose-400 font-mono text-xs">⚠️ Terjadi kendala: ${esc(j.error || 'Gagal memproses respons.')}</div>`;
      appendBubble('a', errTxt);
      pushHistory('a', errTxt);
      return;
    }

    let extraHtml = '';

    // Verdict Badge Card
    if (j.verdict) {
      const v = j.verdict;
      const vLabel = (v.label || 'meragukan').toLowerCase();
      
      let badgeTheme = 'bg-amber-500/10 text-amber-300 border-amber-500/30';
      if (vLabel === 'hoaks') badgeTheme = 'bg-rose-500/10 text-rose-300 border-rose-500/30';
      if (vLabel === 'valid') badgeTheme = 'bg-emerald-500/10 text-emerald-300 border-emerald-500/30';
      if (vLabel === 'fiksi') badgeTheme = 'bg-sky-500/10 text-sky-300 border-sky-500/30';

      extraHtml += `
        <div class="mt-3 p-3.5 rounded-xl bg-white/[0.02] border border-white/[0.06] space-y-2">
          <div class="flex items-center justify-between">
            <span class="text-[10px] font-mono tracking-wider uppercase px-2 py-0.5 rounded border ${badgeTheme} font-bold">
              ${esc(vLabel.toUpperCase())}
            </span>
            <span class="text-xs font-mono text-slate-400">Skor Indikator: <b class="text-slate-200">${v.skor}/100</b></span>
          </div>
          <p class="text-xs text-slate-300 font-medium">${esc(v.kesimpulan)}</p>
        </div>
      `;
    }

    // Sources Card (Wikipedia / Cek Fakta)
    if (j.sumber) {
      let srcItems = '';
      (j.sumber.wikipedia || []).forEach(s => {
        srcItems += `
          <div class="text-xs text-slate-300 py-1 border-b border-white/[0.04] last:border-0 flex items-start gap-1.5">
            <span class="text-slate-400 font-mono text-[10px]">WIKI</span>
            <div>
              <a href="${s.url}" target="_blank" class="text-brand-bronze hover:underline font-medium">${esc(s.judul)}</a>
              <span class="text-slate-400 text-[11px] block sm:inline"> — ${esc(s.cuplikan || '')}</span>
            </div>
          </div>
        `;
      });
      (j.sumber.cek_fakta || []).forEach(s => {
        srcItems += `
          <div class="text-xs text-slate-300 py-1 border-b border-white/[0.04] last:border-0 flex items-center gap-1.5">
            <span class="text-emerald-400 font-mono text-[10px]">VERIF</span>
            <a href="${s.url}" target="_blank" class="text-brand-bronze hover:underline font-medium">${esc(s.judul)}</a>
          </div>
        `;
      });

      if (srcItems) {
        extraHtml += `
          <div class="mt-2.5 p-3 rounded-xl bg-black/30 border border-white/[0.05] space-y-1">
            <div class="text-[10px] font-mono uppercase tracking-wider text-slate-400 mb-1">Rujukan & Bukti Web Terkait:</div>
            ${srcItems}
          </div>
        `;
      }
    }

    const finalHtml = `<div class="whitespace-pre-line">${esc(j.reply)}</div>${extraHtml}`;
    appendBubble('a', finalHtml, `${j.model_size || '?'} · ${now()}`);
    pushHistory('a', finalHtml, j.model_size || '?');

  } catch (err) {
    lod.remove();
    const failHtml = `<div class="text-rose-400 font-mono text-xs">⚠️ Server tidak dapat dijangkau. Pastikan aplikasi Flask sedang aktif.</div>`;
    appendBubble('a', failHtml);
    pushHistory('a', failHtml);
  }

  btn.disabled = false;
  inp.focus();
}

btn.onclick = kirim;
inp.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    kirim();
  }
});
inp.addEventListener('input', () => {
  inp.style.height = 'auto';
  inp.style.height = Math.min(160, inp.scrollHeight) + 'px';
});

document.getElementById('newchat').onclick = () => {
  cur = -1;
  sid = 's' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  localStorage.setItem('sagi_sid', sid);
  paint();
  renderList();
};

renderList();
paint();
</script>
</body>
</html>
