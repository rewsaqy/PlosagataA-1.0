<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sagi — Daftar Model</title>
<style>
body{font-family:system-ui,sans-serif;max-width:760px;margin:2rem auto;padding:0 1rem;background:#212121;color:#ececec}
.card{background:#1a2233;border:1px solid #33405f;border-radius:14px;padding:1.1rem;margin-bottom:.9rem}
.card.on{border-color:#10a37f}
h1{font-size:1.3rem}small{color:#9aa4c0}
button{background:#10a37f;color:#04110b;border:0;padding:.6rem 1.1rem;border-radius:10px;cursor:pointer;font-weight:700}
button:disabled{opacity:.4;cursor:default}
.tag{display:inline-block;font-size:.72rem;background:#232d45;border:1px solid #33405f;border-radius:99px;padding:.15rem .6rem;margin-right:.3rem}
a{color:#8fb0ff}
#msg{min-height:1.4em;color:#ffd479}
</style>
</head>
<body>
<h1>🤖 Model Sagi</h1>
<p><small>Ganti model = engine lama <b>dibongkar total</b> (RAM kembali), engine baru dinyalakan dengan sesi fresh. <a href="/chat">← ke chat</a></small></p>
<div id="msg"></div>
<div id="list">Memuat...</div>
<script>
async function muat(){
  const j = await (await fetch('/api/models')).json();
  const box = document.getElementById('list'); box.innerHTML = '';
  j.models.forEach(m => {
    const aktif = m.name === j.active;
    const el = document.createElement('div');
    el.className = 'card' + (aktif ? ' on' : '');
    el.innerHTML = `<h3>${m.display} ${aktif ? '● AKTIF' : ''}</h3>
      <p><span class="tag">${(m.params/1e6).toFixed(1)} jt param</span>
      <span class="tag">${m.layers} layer</span><span class="tag">dim ${m.dim}</span>
      <span class="tag">${m.loaded ? (m.trained ? 'terlatih ✅' : 'acak ⚠️') : 'mati 💤'}</span></p>
      <button ${aktif ? 'disabled' : ''} data-m="${m.name}">${aktif ? 'Dipakai' : 'Pakai model ini'}</button>`;
    box.appendChild(el);
  });
  box.querySelectorAll('button[data-m]').forEach(b => b.onclick = async () => {
    document.getElementById('msg').innerText = 'Mematikan engine lama, menyalakan ' + b.dataset.m + '...';
    const r = await fetch('/api/models/select', {method:'POST',
      headers:{'Content-Type':'application/json'}, body: JSON.stringify({model:b.dataset.m})});
    const j2 = await r.json();
    document.getElementById('msg').innerText = j2.ok
      ? `Aktif: ${j2.active} (${(j2.params/1e6).toFixed(1)} jt param). Dimatikan: ${j2.dimatikan.join(', ')||'tidak ada'}.`
      : ('Gagal: ' + j2.error);
    muat();
  });
}
muat();
</script>
</body>
</html>
